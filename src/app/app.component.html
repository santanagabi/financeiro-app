<mat-sidenav-container class="sidenav-container">
  <mat-sidenav [opened]="menuOpen()" (openedChange)="menuOpen.set($event)" mode="over" class="sidenav">
    <mat-toolbar color="primary">Financeiro</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" (click)="menuOpen.set(false)">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/cadastro" routerLinkActive="active" (click)="menuOpen.set(false)">
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>Nova Movimentação</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="toggleMenu()" aria-label="Abrir Menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Itaú Financeiro</span>
      <span class="spacer"></span>
      <button mat-icon-button aria-label="Perfil do usuário">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>
    <main class="page-content" id="main-content" role="main">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
