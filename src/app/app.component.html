<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">🏦</span>
      <span>FINANCEIRO</span>
    </div>

    <nav class="nav">
      <!-- routerLink é o equivalente ao <router-link to="...">; routerLinkActive é o active-class -->
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">⌂</span> Dashboard
      </a>
      <a routerLink="/cadastro" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">＋</span> Nova Movimentação
      </a>
    </nav>
  </aside>

  <div class="content">
    <header class="topbar">
      <div></div>
      <div class="user-chip">
        <div class="user-avatar">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </header>

    <main class="page">
      <!-- router-outlet é IDÊNTICO ao <router-view /> do Vue Router -->
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
