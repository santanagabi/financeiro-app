<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">🏦</span>
      <span>FINANCEIRO</span>
    </div>

    <nav class="nav">
      <!-- routerLink é o equivalente ao <router-link to="...">; routerLinkActive é o active-class -->
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">⌂</span> Dashboard
      </a>
      <a routerLink="/cadastro" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">＋</span> Nova Movimentação
      </a>
    </nav>
  </aside>

  <div class="content">
    <header class="topbar">
      <div></div>
      <div class="user-chip">👤 Candidato(a) <span class="chevron">⌄</span></div>
    </header>

    <main class="page">
      <!-- router-outlet é IDÊNTICO ao <router-view /> do Vue Router -->
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
